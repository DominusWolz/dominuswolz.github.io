<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Fútbol</title>
    
    <link rel="stylesheet" href="../css/Style.css">
</head>
<body>

    <div class="contenedor-crud">
        <h1>Inventario de Fútbol</h1>
        
        <form id="formulario-producto">
            <input type="hidden" id="indice-edicion" value="-1">
            
            <div class="grupo-inputs">
                <input type="text" id="id-producto" placeholder="ID (Ej: F-01)" required>
                <input type="text" id="nombre" placeholder="Nombre (Ej: Balón Qatar)" required>
                <input type="number" id="precio" placeholder="Precio ($)" min="1" required>
                <input type="number" id="cantidad" placeholder="Cantidad" min="1" required>
            </div>
            
            <button type="submit" id="btn-guardar" class="btn-enlace">Agregar Producto</button>
        </form>

        <table class="tabla-estilizada">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
            </tbody>
        </table>
    </div>

    
    <script src="../js/crud.js"></script>
</body>
</html>
